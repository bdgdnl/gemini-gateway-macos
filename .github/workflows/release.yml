name: Release macOS app
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version and runner
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Check source publication
        run: python3 scripts/check_publication.py
      - name: Build and test
        run: |
          bash build.sh
          python3 Tests/integration.py
      - name: Package
        run: bash scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/Gemini-Gateway-macOS-arm64.zip dist/SHA256SUMS \
            --verify-tag --title "Gemini Gateway $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
