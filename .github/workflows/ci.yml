name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source publication
        run: python3 scripts/check_publication.py
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build
        run: bash build.sh
      - name: Run loopback integration tests
        run: python3 Tests/integration.py
      - name: Package standalone gateway
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gemini-Gateway-macOS-arm64
          path: |
            dist/Gemini-Gateway-macOS-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
